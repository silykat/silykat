# Weekly updates, never of a version published less than 7 days ago (like .npmrc's min-release-age).
# Pull request titles follow Conventional Commits: dependencies shipped with the product are fixes (a
# patch release), development tools are chores (no release).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase # exact versions stay exact
    ignore:
      # Must match engines.vscode, the oldest VS Code supported (vsce refuses newer types): bumped
      # by hand, together with it.
      - dependency-name: '@types/vscode'
      # Must describe the Node.js the code runs on (VS Code's own, Node.js 20 or later for the
      # plugin): newer major versions would allow APIs that users do not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
