# Checks every pull request to main, to an epic branch, or to a feature branch (stacked pull requests).
# Actions are pinned by commit (Dependabot updates them); Node.js comes from .nvmrc.
name: CI

on:
  pull_request:
    branches: [main, 'epic/**', 'feat/**']
  # By hand too (Actions tab, or `gh workflow run ci.yml`).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # no git hooks in the CI

jobs:
  checks:
    name: Checks, unit tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test # also dependency boundaries and the freshness of the plugin bundles
      - run: npm run coverage
      - run: npm run package # also checks that the extension makes no network call
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silykat-vsix
          path: packages/vscode-extension/dist/silykat.vsix
          if-no-files-found: error

  linux:
    name: Integration tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image of `npm run test:linux`: the same recipe as locally.
      - run: docker build -f scripts/linux/Dockerfile -t silykat-linux-tests .
      # VS Code's renderer crashes with Docker's default 64 MB of shared memory.
      - run: docker run --rm --shm-size=2g silykat-linux-tests sh scripts/linux/run-tests.sh integration

  # The repository is public: standard GitHub-hosted runners, macOS included, cost nothing.
  macos:
    name: Integration tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
