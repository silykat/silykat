# The pull request title becomes the commit message on main (squash): it must follow Conventional
# Commits. A workflow of its own, so that editing the title checks it again without skipping, and so
# passing, the jobs of the CI.
name: Pull request title

on:
  pull_request:
    branches: [main, 'epic/**']
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: 0 # no git hooks in the CI

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint
