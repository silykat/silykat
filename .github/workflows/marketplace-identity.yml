# Shows the id of the Azure managed identity that publishes the extension, as the VS Code Marketplace
# knows it: a maintainer adds that id to the members of the `silykat` publisher, with the Contributor
# role, once. Run it by hand (Actions tab), or by pushing a branch named `publish/identity` (the only
# way before this workflow is on the default branch). It needs the approval of the `marketplace`
# environment, and its Azure secrets.
name: Marketplace identity

on:
  workflow_dispatch:
  push:
    branches: [publish/identity]

permissions: {}

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write # sign in to Azure with OpenID Connect
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Show the identity's id for the Marketplace
        run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "Add this id to the members of the silykat publisher, as a Contributor: $id"
          echo "### Marketplace identity" >> "$GITHUB_STEP_SUMMARY"
          echo "Add \`$id\` to the members of the \`silykat\` publisher (marketplace.visualstudio.com/manage), with the **Contributor** role." >> "$GITHUB_STEP_SUMMARY"
